name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  go-redis:
    runs-on: ubuntu-latest
    services:
      redis: { image: "redis:7-alpine", ports: ["6379:6379"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 ./internal/state
        env: { REDIS_TEST_URL: "redis://127.0.0.1:6379/0" }

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test web/wasm/*.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: make frontend
      - run: make e2e
        env: { CHROME_BIN: /usr/bin/google-chrome }

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        run: docker build -t app:ci .
      - name: container boots, is non-root, passes its own healthcheck
        run: |
          docker run -d --name app -e APP_ENV=development -e APP_ADDR=0.0.0.0:8080 -e APP_ORIGIN=:8080 \
            -e APP_SESSION_SECRET=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY \
            -e APP_LOGIN_PASSWORD=ci-only-password -e APP_OPERATIONS_TOKEN=ci-only-token app:ci
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && exit 0; sleep 2; done
          docker logs app; exit 1
