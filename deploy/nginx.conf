# Reverse proxy in front of the app: absorbs slow clients and connection
# floods with an event loop that is cheaper per connection than the app, and
# applies coarse request/connection limits before traffic reaches Go.
#
# Set the app's APP_TRUSTED_PROXIES to this proxy's address, and bind the app
# to loopback or a private interface. Behind a CDN also restore the true client:
# keep `set_real_ip_from` ranges equal to the CDN ranges (otherwise delete).
#
# Validate with: nginx -t -c $(pwd)/deploy/nginx.conf

worker_processes auto;
worker_rlimit_nofile 200000;
events { worker_connections 65535; multi_accept on; }

http {
    server_tokens off;

    # --- slow-client / slowloris defences -----------------------------------
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    keepalive_timeout     20s;
    keepalive_requests    200;
    reset_timedout_connection on;
    client_max_body_size  1m;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # --- trust the CDN for the client address (adjust / remove) -------------
    # set_real_ip_from 103.21.244.0/22;   # example: Cloudflare range
    # real_ip_header   CF-Connecting-IP;
    # real_ip_recursive on;

    # --- per-client limits ---------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=perip:20m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=connperip:20m;
    limit_req_status  429;
    limit_conn_status 429;

    upstream app { server 127.0.0.1:8080; keepalive 64; }

    server {
        listen 80 default_server reuseport backlog=8192;   # terminate TLS here in production
        server_name _;

        limit_conn connperip 50;
        limit_req  zone=perip burst=60 nodelay;

        location = /auth/login      { limit_req zone=login burst=5 nodelay; include /etc/nginx/fh_proxy.inc; }
        location = /secure-config.json { limit_req zone=login burst=5 nodelay; include /etc/nginx/fh_proxy.inc; }
        location /                  { include /etc/nginx/fh_proxy.inc; }
    }
}

