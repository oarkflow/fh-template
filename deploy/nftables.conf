#!/usr/sbin/nft -f
# Host firewall for the origin. Edit the two sets, then:
#   sudo nft -c -f deploy/nftables.conf     # syntax check
#   sudo nft -f deploy/nftables.conf        # apply (keep an SSH session open!)
#
# Goals: (1) only your CDN / load balancer can reach the app port, so attackers
# cannot bypass the CDN by hitting the origin; (2) cap per-source SYN and
# connection rates at the kernel, far cheaper than doing it in Go; (3) drop
# invalid packets and UDP/ICMP amplification vectors this TCP-only service
# never needs.

flush ruleset

define APP_PORT = 8080
define SSH_PORT = 22

table inet ddos {
    # Addresses allowed to reach APP_PORT: your CDN / LB egress ranges
    # (for Cloudflare: https://www.cloudflare.com/ips/ ). Replace the example.
    set proxies4 { type ipv4_addr; flags interval; elements = { 10.0.0.0/8 } }
    set proxies6 { type ipv6_addr; flags interval; elements = { fd00::/8 } }
    # Admin addresses allowed to SSH.
    set admins4  { type ipv4_addr; flags interval; elements = { 192.0.2.0/24 } }

    # Dynamic per-source meters.
    set syn_flood  { type ipv4_addr; flags dynamic,timeout; timeout 1m; size 262144; }
    set conn_flood { type ipv4_addr; flags dynamic,timeout; timeout 1m; size 262144; }

    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state invalid drop
        ct state established,related accept

        # Needed ICMP only, rate limited (no echo flood, no amplification).
        icmp type { destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept
        icmp type echo-request limit rate 5/second burst 10 packets accept
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # SSH from admins only, brute-force limited.
        tcp dport $SSH_PORT ip saddr @admins4 ct state new limit rate 10/minute accept

        # App port: only the proxies, and cap the SYN rate and concurrent
        # connections per source even for them (a compromised proxy / NAT).
        tcp dport $APP_PORT tcp flags & (syn|ack) == syn ip saddr != @proxies4 drop
        tcp dport $APP_PORT tcp flags & (syn|ack) == syn ip saddr @proxies4 add @syn_flood { ip saddr limit rate over 2000/second burst 4000 packets } drop
        tcp dport $APP_PORT ct state new ip saddr @proxies4 add @conn_flood { ip saddr ct count over 5000 } drop
        tcp dport $APP_PORT ip saddr @proxies4 accept
        tcp dport $APP_PORT ip6 saddr @proxies6 accept

        # Everything else (all UDP incl. DNS/NTP/memcached amplification
        # reflection, other ports) falls through to the default drop policy.
    }

    chain forward { type filter hook forward priority filter; policy drop; }
    chain output  { type filter hook output  priority filter; policy accept; }
}
