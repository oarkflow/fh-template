# Kernel hardening against SYN floods and connection exhaustion.
# Install: sudo cp deploy/sysctl-ddos.conf /etc/sysctl.d/90-ddos.conf && sudo sysctl --system
# Linux only. Review values against your RAM / expected connection count.

# SYN cookies: keep accepting real clients when the SYN backlog is full.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 3

# Free half-open / dead connections sooner.
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 4
net.ipv4.tcp_max_orphans = 16384
net.ipv4.tcp_abort_on_overflow = 0

# Reject spoofed sources (reverse-path filter) and source routing / redirects.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_rfc1337 = 1

# Connection-tracking table: size it, shorten timeouts for half-open state.
net.netfilter.nf_conntrack_max = 524288
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 30
net.netfilter.nf_conntrack_tcp_timeout_established = 3600

# File descriptors (also set LimitNOFILE in the service unit).
fs.file-max = 1048576
